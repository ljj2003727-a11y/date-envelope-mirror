<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>给林夏的约会邀请</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <button
      class="music-toggle"
      id="musicToggle"
      type="button"
      aria-label="播放背景音乐"
      title="播放背景音乐"
    >♫</button>

    <audio id="bgMusic" loop preload="auto" src="./music.mp3">
      你的浏览器不支持音频播放。
    </audio>

    <canvas id="petalCanvas" aria-hidden="true"></canvas>

    <main class="scene">
      <div class="ambient-art ambient-art-moon" aria-hidden="true">
        <svg viewBox="0 0 220 190" role="img">
          <path class="art-window" d="M28 142V58c0-24 19-43 43-43h78c24 0 43 19 43 43v84Z" />
          <path class="art-sky" d="M45 136V62c0-15 12-27 27-27h56c15 0 27 12 27 27v74Z" />
          <path class="art-moon" d="M130 56c-15 4-25 17-25 32 0 18 15 33 33 33 8 0 15-3 21-8-4 17-19 30-37 30-21 0-38-17-38-38 0-18 12-33 29-37 5-1 11-1 17 0Z" />
          <circle class="art-star" cx="66" cy="74" r="4" />
          <circle class="art-star" cx="83" cy="106" r="2.8" />
          <circle class="art-star" cx="153" cy="84" r="3.4" />
          <path class="art-sill" d="M18 143h184" />
        </svg>
      </div>

      <div class="ambient-art ambient-art-bouquet" aria-hidden="true">
        <svg viewBox="0 0 220 220" role="img">
          <path class="art-stem" d="M109 89c-6 42-19 76-40 103" />
          <path class="art-stem" d="M119 88c10 39 26 72 48 96" />
          <path class="art-stem" d="M112 94c2 41-2 76-13 105" />
          <path class="art-leaf" d="M82 134c-20-2-36-14-45-33 20-3 37 7 45 33Z" />
          <path class="art-leaf" d="M142 136c19-6 33-20 39-40-20 1-35 14-39 40Z" />
          <circle class="art-flower rose" cx="74" cy="71" r="24" />
          <circle class="art-flower coral" cx="117" cy="52" r="27" />
          <circle class="art-flower gold" cx="156" cy="83" r="23" />
          <path class="art-wrap" d="M54 134h112l-25 72H79Z" />
          <path class="art-ribbon" d="M85 156c18 11 37 11 56 0" />
        </svg>
      </div>

      <section class="stage" aria-live="polite">
        <div class="intro" id="introCopy">
          <p class="eyebrow">写给林夏的一封信</p>
          <h1><span class="recipient-name">林夏</span>，想和你约会</h1>
          <p class="intro-subcopy">把心动瞬间记录下来，也许就是我能送出的第一份礼物。</p>
        </div>

        <div class="mail-wrap">
          <div class="date-illustration date-illustration-left" aria-hidden="true">
            <svg viewBox="0 0 240 210" role="img">
              <path class="picnic-blanket" d="M39 154h162l-26 40H65Z" />
              <path class="picnic-line" d="M75 154l12 40M120 154v40M165 154l-12 40" />
              <path class="cup" d="M68 92h39l-6 52H74Z" />
              <path class="cup" d="M145 92h39l-6 52h-27Z" />
              <path class="cup-heart" d="M88 116c-8-7-19 4-8 13l8 7 8-7c11-9 0-20-8-13Z" />
              <path class="cup-heart" d="M164 116c-8-7-19 4-8 13l8 7 8-7c11-9 0-20-8-13Z" />
              <path class="steam" d="M82 77c-12-14 10-18 0-32" />
              <path class="steam" d="M99 77c-12-14 10-18 0-32" />
              <path class="steam" d="M156 77c-12-14 10-18 0-32" />
              <path class="steam" d="M173 77c-12-14 10-18 0-32" />
            </svg>
          </div>

          <div class="date-illustration date-illustration-right" aria-hidden="true">
            <svg viewBox="0 0 240 210" role="img">
              <path class="bike-wheel" d="M63 150a31 31 0 1 0 0 1" />
              <path class="bike-wheel" d="M177 150a31 31 0 1 0 0 1" />
              <path class="bike-frame" d="M63 150h48l22-48 44 48h-64L88 116" />
              <path class="bike-frame" d="M133 102h28M88 116l-11-26h31" />
              <path class="bike-flower" d="M179 76c-14-6-30 3-34 17 15 5 29-2 34-17Z" />
              <path class="bike-flower" d="M164 70c-4-15-18-25-33-21 3 16 17 25 33 21Z" />
              <path class="bike-stem" d="M156 96c-11 7-21 16-29 29" />
            </svg>
          </div>

          <button
            class="envelope"
            id="openEnvelope"
            type="button"
            aria-label="打开给林夏的约会邀请信"
            aria-expanded="false"
            aria-controls="letter"
          >
            <span class="envelope-shadow" aria-hidden="true"></span>
            <span class="envelope-back" aria-hidden="true"></span>
            <span class="envelope-flap" aria-hidden="true"></span>
            <span class="envelope-left" aria-hidden="true"></span>
            <span class="envelope-right" aria-hidden="true"></span>
            <span class="envelope-front" aria-hidden="true"></span>
            <span class="recipient-label" aria-hidden="true">
              <span>To</span>
              <strong>林夏</strong>
            </span>
            <span class="seal" aria-hidden="true">♥</span>
            <span class="sr-only">打开这封信</span>
          </button>

          <article class="letter" id="letter" aria-hidden="true" inert>
            <header class="letter-head">
              <p class="letter-kicker">Dear 林夏</p>
              <h2>林夏，这个周末，可以把一点时间留给我吗？</h2>
            </header>

            <div class="letter-illustration" aria-hidden="true">
              <svg viewBox="0 0 520 150" role="img">
                <path class="table-shadow" d="M88 124h344" />
                <path class="table" d="M105 88h310v30H105Z" />
                <path class="table-leg" d="M143 116l-23 35M377 116l23 35" />
                <path class="plate" d="M151 83c0-15 22-27 49-27s49 12 49 27-22 27-49 27-49-12-49-27Z" />
                <path class="plate-inner" d="M178 83c0-7 10-12 22-12s22 5 22 12-10 12-22 12-22-5-22-12Z" />
                <path class="glass" d="M303 55h42l-8 58h-26Z" />
                <path class="glass-light" d="M312 64h25" />
                <path class="candle" d="M377 61h18v57h-18Z" />
                <path class="flame" d="M386 25c15 18 4 31-3 38-10-13-4-27 3-38Z" />
                <path class="tiny-heart" d="M263 48c-9-9-24 4-10 16l10 9 10-9c14-12-1-25-10-16Z" />
              </svg>
            </div>

            <p>
              我想约你一起吃一顿慢慢来的晚餐，等天色变温柔以后，再去散一小段步。
              不需要很盛大，只想把那一刻认真留给你。
            </p>

            <p class="memory-line">
              我想把和林夏在一起的每个心动瞬间，都像礼物一样认真记录下来。
            </p>

            <dl class="date-details" aria-label="约会安排">
              <div>
                <dt>时间</dt>
                <dd>这个周末傍晚</dd>
              </div>
              <div>
                <dt>地点</dt>
                <dd>林夏喜欢的那家店</dd>
              </div>
              <div>
                <dt>心情</dt>
                <dd>期待见你</dd>
              </div>
            </dl>

            <p class="signature">
              林夏，如果你愿意，我会带上一束花，也带上认真准备好的心情。
              <span>想见你的人</span>
            </p>

            <div class="actions">
              <button class="primary-action" id="acceptDate" type="button">
                <span aria-hidden="true">♥</span>
                愿意赴约
              </button>
              <button class="secondary-action" id="maybeDate" type="button">
                再想想
              </button>
            </div>

            <p class="response" id="responseText" aria-live="polite"></p>
          </article>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
